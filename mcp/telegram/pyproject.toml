[project]
name = "telegram-mcp"
version = "0.1.0"
description = "An MCP server over the user's own Telegram account: list chats, read a chat's messages over a time window."
requires-python = ">=3.10"
dependencies = ["mcp>=1.0", "telethon>=1.40"]

[project.scripts]
telegram-mcp = "telegram_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]
